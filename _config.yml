
remote_theme: "mmistakes/minimal-mistakes@4.28.0"

minimal_mistakes_skin: "default"

locale: "ko-KR"

title: "Kwon's Tech Blog"
title_separator: "-"
name: "Kwon"

description: "Being Around"

url: "https://kwon-s-w.github.io"
baseurl: ""

repository: "kwon-s-w/kwon-s-w.github.io"

search: true
breadcrumbs: true
read_time: true
words_per_minute: 200

author:
  name: "Kwon"
  bio: "Exploring Technology and Engineering"
  location: "South Korea"

markdown: kramdown
permalink: /:categories/:title/

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-sitemap

include:
  - _pages

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      toc: true
      toc_sticky: true
